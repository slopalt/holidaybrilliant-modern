name: Release

# Push a tag like v1.3.1 (or run manually from the Actions tab) to build and publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.3.1'
        required: true

permissions:
  contents: write

env:
  ORIGINAL_APK_SHA256: 05801c9fae2dc65b2835357285794edcdb8ea7d6d68b8cd7380b0de792ce879a

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check configuration
        env:
          APK_URL: ${{ vars.ORIGINAL_APK_URL }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=0
          [ -n "$APK_URL" ] || { echo "::error::Set the repository variable ORIGINAL_APK_URL"; missing=1; }
          [ -n "$KS_B64" ]  || { echo "::error::Set the secret KEYSTORE_BASE64"; missing=1; }
          [ -n "$KS_PASS" ] || { echo "::error::Set the secret KEYSTORE_PASSWORD"; missing=1; }
          exit $missing

      - name: Work out version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "::error::Tag must start with v (got '$TAG')"; exit 1 ;; esac
          # versionCode must increase every release so phones accept it as an update (6 = first patched build)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}-offline" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Download and verify original APK
        env:
          APK_URL: ${{ vars.ORIGINAL_APK_URL }}
        run: |
          mkdir -p input
          curl -fsSL --retry 3 -A "Mozilla/5.0" -o input/original.apk "$APK_URL"
          echo "$ORIGINAL_APK_SHA256  input/original.apk" | sha256sum -c -

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'hb' }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          ./build.sh input/original.apk "$RUNNER_TEMP/release.jks" "$KS_ALIAS" "$KS_PASS" "$KEY_PASS"
          OUT="HolidayBrilliant_${{ steps.ver.outputs.name }}.apk"
          mv HolidayBrilliant_1.3-offline.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cat > notes.md <<NOTES
          Holiday Brilliant patched for modern Android and offline use.

          **Install:** uninstall the original app first (different signing key), then install \`$OUT\`.
          Turn phone media volume all the way up — the lights only hear commands at high volume.

          versionCode ${{ steps.ver.outputs.code }}
          NOTES
          gh release create "$TAG" "$OUT" "$OUT.sha256" \
            --title "Holiday Brilliant $TAG" --notes-file notes.md --target "$GITHUB_SHA"
